<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Smart School" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Smart School Care Platform</title>
    <meta name="description" content="A comprehensive school management and student care platform with RBAC and real-time cross-classroom data syncing." />
    <meta property="og:title" content="Smart School Care Platform" />
    <meta property="og:description" content="A comprehensive school management and student care platform with RBAC and real-time cross-classroom data syncing." />
    <script>
      /* ธีม/ขนาดตัวอักษรที่ผู้ใช้เลือกไว้ (ค่าจากเครื่องนี้) — ตั้งก่อนวาดหน้าเพื่อไม่ให้จอกะพริบ; ตรรกะเต็มอยู่ src/lib/userPreferences.ts */
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('ssc.prefs.v1') || '{}');
          var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          if (p.textScale === 'large' || p.textScale === 'xlarge') r.setAttribute('data-text-scale', p.textScale);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
